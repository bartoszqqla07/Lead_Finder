# Buduje LeadFinder.Web (React + ASP.NET Core) i wdraża na Azure App Service przy każdym pushu do main.
#
# Wymagana konfiguracja repozytorium (Settings → Secrets and variables → Actions):
#   Variables: AZURE_WEBAPP_NAME             – nazwa aplikacji w Azure, np. leadfinder-bartosz
#   Secrets:   AZURE_WEBAPP_PUBLISH_PROFILE  – zawartość pliku "publish profile" pobranego z Azure
# Dopóki zmienna AZURE_WEBAPP_NAME nie jest ustawiona, wdrożenie jest pomijane (build nadal się wykonuje).

name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/LeadFinder.Web/ClientApp/package-lock.json

      - name: Build frontend
        working-directory: src/LeadFinder.Web/ClientApp
        run: |
          npm ci --no-audit --no-fund
          npm run build

      # Frontend jest już w wwwroot, więc MSBuild nie buduje go drugi raz.
      # Bez -r (runtime): paczka przenośna – działa w 32-bitowym procesie planu F1.
      - name: Publish backend
        run: dotnet publish src/LeadFinder.Web -c Release -p:SkipClientBuild=true -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: leadfinder-web
          path: publish

  deploy:
    needs: build
    if: vars.AZURE_WEBAPP_NAME != ''
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.webapp-url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: leadfinder-web
          path: publish

      - name: Deploy to Azure App Service
        id: deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: publish
