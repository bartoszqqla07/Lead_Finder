<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LeadFinder – brak połączenia</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --surface: #fff;
        --text: #17191c;
        --text-2: #5b6270;
        --accent: #4f46e5;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1115;
          --surface: #171a20;
          --text: #e8eaee;
          --text-2: #a4abb8;
          --accent: #818cf8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
      }
      main {
        max-width: 360px;
        background: var(--surface);
        border-radius: 14px;
        padding: 28px 24px;
      }
      img {
        width: 56px;
        height: 56px;
        border-radius: 14px;
      }
      h1 {
        font-size: 18px;
        margin: 16px 0 6px;
      }
      p {
        color: var(--text-2);
        margin: 0 0 20px;
      }
      button {
        font: inherit;
        font-weight: 600;
        border: none;
        border-radius: 8px;
        padding: 10px 20px;
        background: var(--accent);
        color: #fff;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Brak połączenia</h1>
      <p>LeadFinder potrzebuje internetu. Sprawdź połączenie i spróbuj ponownie.</p>
      <button onclick="location.reload()">Spróbuj ponownie</button>
    </main>
  </body>
</html>
